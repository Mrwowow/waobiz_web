name: CD - Build & Validate

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Validate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, sodium, fileinfo
        coverage: none

    - name: Validate composer.json
      run: composer validate --strict

    - name: Install Composer dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

    - name: Build successful
      run: echo "✅ Build validated successfully! Run 'git pull' on server to deploy."

  health-check:
    name: Website Health Check
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Check Website Health
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" https://waobiz.app)
        if [ $response -eq 200 ] || [ $response -eq 302 ]; then
          echo "✅ Website is responding (HTTP $response)"
        else
          echo "⚠️ Website returned HTTP $response (this is expected if not yet deployed)"
        fi
      continue-on-error: true
