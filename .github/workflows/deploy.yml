name: CD - Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

jobs:
  deploy:
    name: Deploy to Windows Server
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup SSH Key
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add Server to Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy via SSH
      env:
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_PATH: ${{ secrets.SERVER_PATH }}
      run: |
        ssh $SERVER_USER@$SERVER_HOST << 'ENDSSH'
          # Navigate to project directory
          cd ${{ secrets.SERVER_PATH }}

          # Enable maintenance mode
          php artisan down || true

          # Pull latest changes
          git fetch origin main
          git reset --hard origin/main

          # Install/Update Composer dependencies
          composer install --no-dev --optimize-autoloader --no-interaction

          # Clear and cache configuration
          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear

          # Run migrations
          php artisan migrate --force

          # Cache for performance
          php artisan config:cache
          php artisan event:cache

          # Set permissions
          icacls storage /grant "IIS_IUSRS:(OI)(CI)F" /T
          icacls bootstrap\cache /grant "IIS_IUSRS:(OI)(CI)F" /T

          # Restart IIS Application Pool
          powershell -Command "Restart-WebAppPool -Name 'DefaultAppPool'"

          # Disable maintenance mode
          php artisan up
        ENDSSH

    - name: Deployment Status
      if: success()
      run: echo "✅ Deployment completed successfully!"

    - name: Notify on Failure
      if: failure()
      run: |
        echo "❌ Deployment failed!"
        exit 1

  post-deploy-checks:
    name: Post-Deployment Checks
    runs-on: ubuntu-latest
    needs: deploy

    steps:
    - name: Check Website Health
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" https://waobiz.app)
        if [ $response -eq 200 ]; then
          echo "✅ Website is responding (HTTP $response)"
        else
          echo "⚠️ Website returned HTTP $response"
          exit 1
        fi

    - name: Verify SSL Certificate
      run: |
        echo | openssl s_client -servername waobiz.app -connect waobiz.app:443 2>/dev/null | openssl x509 -noout -dates
